<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="title desc">
  <title id="title">Tanium Linear Chain Placeholder Diagram</title>
  <desc id="desc">Placeholder visualization representing the flow of Tanium questions through the platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
  </defs>
  <rect width="800" height="320" fill="url(#bg)" rx="24" ry="24" />
  <g fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="90" y="120" width="120" height="80" rx="12" ry="12" />
    <rect x="260" y="120" width="120" height="80" rx="12" ry="12" />
    <rect x="430" y="120" width="120" height="80" rx="12" ry="12" />
    <rect x="600" y="120" width="120" height="80" rx="12" ry="12" />
    <path d="M210 160h40" />
    <path d="M380 160h40" />
    <path d="M550 160h40" />
  </g>
  <g fill="#e0f2fe" font-family="'Inter', Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
    <text x="150" y="165">Endpoints</text>
    <text x="320" y="165">Sensors</text>
    <text x="490" y="165">Packages</text>
    <text x="660" y="165">Actions</text>
  </g>
  <text x="400" y="260" fill="#bae6fd" font-family="'Inter', Arial, sans-serif" font-size="20" text-anchor="middle">
    Linear chain: Ask, Gather, Decide, Act
  </text>
</svg>
