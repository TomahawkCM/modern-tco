name: Browser Automation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      visual_test_pages:
        description: "Pages to test (comma-separated, e.g., /welcome,/practice)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install agent-browser with Chromium
        run: |
          npx agent-browser install --with-deps || true
          # Fallback: install system dependencies if needed
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-shm0 libx11-xcb1 libx11-6 libxcb1 libxext6 \
            libxrandr2 libxcomposite1 libxcursor1 libxdamage1 \
            libxfixes3 libxi6 libgtk-3-0 libpangocairo-1.0-0 \
            libpango-1.0-0 libatk1.0-0 libcairo-gobject2 libcairo2 \
            libgdk-pixbuf-2.0-0 libxrender1 libasound2t64 libfreetype6 \
            libfontconfig1 libdbus-1-3 libnss3 libnspr4 \
            libatk-bridge2.0-0 libdrm2 libxkbcommon0 libatspi2.0-0 \
            libcups2 libxshmfence1 libgbm1 || true

      - name: Build application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Start application server
        run: |
          npm run start &
          sleep 10
        env:
          NODE_ENV: production
          PORT: 3000

      - name: Run visual tests
        env:
          VISUAL_TEST_PAGES: ${{ github.event.inputs.visual_test_pages }}
        run: |
          if [ -n "$VISUAL_TEST_PAGES" ]; then
            npm run browser:visual-test -- --pages "$VISUAL_TEST_PAGES"
          else
            npm run browser:visual-test
          fi

      - name: Upload visual test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-test-report
          path: |
            tests/visual-reports/
            tests/screenshots/
          retention-days: 30

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read test results
            const resultsPath = 'tests/visual-reports/visual-test-results.json';
            if (!fs.existsSync(resultsPath)) {
              console.log('No results file found');
              return;
            }

            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf-8'));
            const passed = results.filter(r => r.status === 'passed').length;
            const failed = results.filter(r => r.status === 'failed').length;
            const errors = results.filter(r => r.status === 'error').length;

            const statusEmoji = failed + errors > 0 ? ':x:' : ':white_check_mark:';

            const pageDetails = results.map(r => {
              const icon = r.status === 'passed' ? ':white_check_mark:' : ':x:';
              return `- ${icon} **${r.name}** (${r.path}): ${r.status}`;
            }).join('\n');

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = `## ${statusEmoji} Visual Test Results

            | Status | Count |
            |--------|-------|
            | Passed | ${passed} |
            | Failed | ${failed} |
            | Errors | ${errors} |

            <details>
            <summary>Page Details</summary>

            ${pageDetails}

            </details>

            [Download full report](${runUrl})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  content-scrape:
    name: Content Scraping (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install agent-browser
        run: npx agent-browser install --with-deps || true

      - name: Run content scraper
        run: |
          # Example: scrape documentation
          # npm run browser:scrape -- --url "https://docs.example.com" --output ./scraped-content.json
          echo "Content scraping is configured for manual execution"
          echo "Use: npm run browser:scrape -- --url <URL> --output <file>"

      - name: Upload scraped content
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraped-content
          path: scraped-content.json
          retention-days: 7
