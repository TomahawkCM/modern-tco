name: Auto-translate i18n Messages

# Trigger on PRs that modify the source translation file
on:
  pull_request:
    paths:
      - "src/i18n/messages/en-US.json"
    types:
      - opened
      - synchronize
      - reopened

# Prevent concurrent runs on the same PR
concurrency:
  group: i18n-translation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-translate:
    name: Auto-translate changed keys
    runs-on: ubuntu-latest

    # Only run if the PR is not from the auto-translation bot
    if: ${{ !startsWith(github.head_ref, 'i18n/auto-translate-') }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for OpenAI API key
        id: check-api-key
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "⚠️  OPENAI_API_KEY not configured. Skipping auto-translation."
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
            echo "✅ OPENAI_API_KEY found. Proceeding with auto-translation."
          fi

      - name: Run incremental translation
        if: steps.check-api-key.outputs.has_key == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🌍 Running incremental translation for changed keys..."
          npm run translate:incremental

      - name: Check for translation changes
        id: check-changes
        run: |
          git add src/i18n/messages/*.json scripts/.translation-cache.json
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No translation changes detected."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Translation changes detected."
          fi

      - name: Commit and push translations
        if: steps.check-changes.outputs.has_changes == 'true' && steps.check-api-key.outputs.has_key == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git commit -m "chore(i18n): auto-translate changes from PR #${PR_NUMBER}

          Automatically translated updated keys in en-US.json to 113 locales.

          - Triggered by: ${PR_TITLE}
          - Source PR: #${PR_NUMBER}
          - Translation engine: OpenAI GPT-4o-mini

          🤖 Generated by GitHub Actions workflow"

          git push origin ${{ github.head_ref }}

      - name: Comment on PR
        if: steps.check-changes.outputs.has_changes == 'true' && steps.check-api-key.outputs.has_key == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const comment = `## 🌍 Auto-translation Complete

            I've automatically translated the updated keys in \`en-US.json\` to **113 locales**.

            ### What was translated

            - ✅ All changed/added keys in \`en-US.json\`
            - ✅ Glossary-validated terminology
            - ✅ Quality checks passed

            ### Files updated

            - \`src/i18n/messages/*.json\` (113 locale files)
            - \`scripts/.translation-cache.json\` (translation cache)

            ### Review checklist

            - [ ] Verify translations in key locales (es-MX, fr-FR, de-DE, pt-BR, ja-JP)
            - [ ] Check RTL languages if applicable (ar-SA, he-IL, fa-IR, ur-PK)
            - [ ] Run \`npm run coverage:report\` to verify coverage increased

            <sub>🤖 Auto-generated by [\`.github/workflows/i18n-translation.yml\`](https://github.com/${{ github.repository }}/blob/main/.github/workflows/i18n-translation.yml)</sub>`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

      - name: Comment on PR (No API Key)
        if: steps.check-api-key.outputs.has_key == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const comment = `## ⚠️  Auto-translation Skipped

            The \`OPENAI_API_KEY\` secret is not configured in this repository.

            ### To enable auto-translation:

            1. Go to **Settings** → **Secrets and variables** → **Actions**
            2. Add a new repository secret named \`OPENAI_API_KEY\`
            3. Set the value to your OpenAI API key
            4. Re-run this workflow or push a new commit

            ### Manual translation

            Run these commands locally to translate:

            \`\`\`bash
            npm run translate:incremental
            git add src/i18n/messages/*.json scripts/.translation-cache.json
            git commit -m "chore(i18n): manual translation update"
            git push
            \`\`\`

            <sub>🤖 Auto-generated by [\`.github/workflows/i18n-translation.yml\`](https://github.com/${{ github.repository }}/blob/main/.github/workflows/i18n-translation.yml)</sub>`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

      - name: Run quality validation
        if: steps.check-changes.outputs.has_changes == 'true' && steps.check-api-key.outputs.has_key == 'true'
        run: |
          echo "📊 Running translation quality checks..."
          npm run coverage:report || echo "⚠️  Quality check failed (non-blocking)"

      - name: Summary
        env:
          HAS_KEY: ${{ steps.check-api-key.outputs.has_key }}
          HAS_CHANGES: ${{ steps.check-changes.outputs.has_changes }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "## 🌍 Auto-translation Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: #${PR_NUMBER}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Key Configured**: ${HAS_KEY}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes Detected**: ${HAS_CHANGES}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${HAS_KEY}" == "true" ] && [ "${HAS_CHANGES}" == "true" ]; then
            echo "✅ Translations updated and committed to this PR." >> $GITHUB_STEP_SUMMARY
          elif [ "${HAS_KEY}" == "false" ]; then
            echo "⚠️  Skipped: OPENAI_API_KEY not configured." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️  No translation changes needed." >> $GITHUB_STEP_SUMMARY
          fi
