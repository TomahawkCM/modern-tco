name: Accessibility Audit

# Run on PRs to budget app and on manual trigger
on:
  pull_request:
    paths:
      - 'src/app/budget-app/**'
      - 'src/components/budget/**'
      - 'src/lib/**'
      - 'public/**'
  workflow_dispatch:

jobs:
  lighthouse-ci:
    name: Lighthouse CI - Accessibility
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start server
        run: |
          npm run start &
          npx wait-on http://localhost:3000
        
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000/budget-app
            http://localhost:3000/budget-app/transactions
            http://localhost:3000/budget-app/budgets
            http://localhost:3000/budget-app/reports
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  pa11y:
    name: Pa11y - WCAG 2.2 AA Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Pa11y
        run: npm install -g pa11y-ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start server
        run: |
          npm run start &
          npx wait-on http://localhost:3000

      - name: Run Pa11y accessibility tests
        run: |
          pa11y-ci \
            --config .pa11yci.json \
            --threshold 0

      - name: Upload Pa11y results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa11y-results
          path: pa11y-results/

  axe-core:
    name: Axe-Core - Additional WCAG Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run Axe accessibility tests
        run: |
          npm run start &
          npx wait-on http://localhost:3000
          npx playwright test tests/accessibility.spec.ts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-results
          path: test-results/

  summary:
    name: Accessibility Summary
    runs-on: ubuntu-latest
    needs: [lighthouse-ci, pa11y, axe-core]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let summary = '## 🔍 Accessibility Audit Results\n\n';
            summary += '### Lighthouse CI\n';
            summary += '✅ Accessibility Score: Check artifacts\n\n';
            summary += '### Pa11y (WCAG 2.2 AA)\n';
            summary += '✅ WCAG Compliance: Check artifacts\n\n';
            summary += '### Axe-Core\n';
            summary += '✅ Additional Checks: Check artifacts\n\n';
            summary += '---\n';
            summary += 'View detailed reports in workflow artifacts.\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

