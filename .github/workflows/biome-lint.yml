# Security reviewed: No untrusted GitHub context variables used in run commands
# All inputs are static strings or npm commands
name: Biome Code Quality

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  biome-check:
    name: Biome Linting & Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Biome check (warn mode)
        id: biome-check
        run: |
          echo "::notice::Running Biome in warn mode - issues reported but won't block PR"
          npm run biome:check -- --reporter=github || true
        continue-on-error: true

      - name: Generate Biome report
        if: always()
        run: |
          echo "### Biome Code Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm run biome:check -- --reporter=summary > biome-report.txt || true
          cat biome-report.txt >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ **Note:** Biome is currently in warn mode. Issues are reported for awareness but won't block merging." >> $GITHUB_STEP_SUMMARY

      - name: Upload Biome report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biome-report
          path: biome-report.txt
          retention-days: 30
